name: ${project.name}
version: ${project.version}
build: ${buildNumber}
main: ${main.class}
author: ${author}
api-version: 1.16

softdepend:
  - PlaceholderAPI
  - Vault
  - EcoBits


libraries:
  - com.google.code.gson:gson:2.8.9
  - org.apache.commons:commons-lang3:3.14.0

permissions:
  markets.command.stats:
    description: Allows access to the /markets stats command
    default: false
  markets.viewstats:
    description: Allows viewing market statistics GUI
    default: false
  markets.admin.transactions:
    description: Allows viewing any player's transactions with /markets transactions <player>
    default: op
  markets.admin.stats:
    description: Allows viewing any player's market statistics with /markets stats <player>
    default: op
  markets.admin.payments:
    description: Allows viewing and collecting any player's pending payments with /markets payments <player>
    default: op
  markets.admin.removerating:
    description: Allows removing market ratings/reviews in the ratings GUI
    default: op
  markets.admin.viewrestricted:
    description: Allows opening closed or server-banned-owner markets via /markets view <player>
    default: op
  markets.command.reviews:
    description: Allows access to the /markets reviews command
    default: true
  markets.alerts.dupe:
    description: Receive alerts when dupe exploits are detected or prevented
    default: op