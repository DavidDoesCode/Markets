name: ${project.name}
version: ${project.version}
build: ${buildNumber}
main: ${main.class}
author: ${author}
api-version: 1.16

softdepend:
  - PlaceholderAPI
  - Vault
  - EcoBits
  - Essentials


libraries:
  - com.google.code.gson:gson:2.8.9
  - org.apache.commons:commons-lang3:3.14.0

permissions:
  markets.command.stats:
    description: Allows access to the /markets stats command
    default: false
  markets.viewstats:
    description: Allows viewing market statistics GUI
    default: false
  markets.admin.transactions:
    description: Allows viewing any player's transactions with /markets transactions <player>
    default: op
  markets.admin.stats:
    description: Allows viewing any player's market statistics with /markets stats <player>
    default: op
  markets.admin.payments:
    description: Allows viewing and collecting any player's pending payments with /markets payments <player>
    default: op
  markets.admin.removerating:
    description: Allows removing market ratings/reviews in the ratings GUI
    default: op
  markets.admin.viewrestricted:
    description: Allows opening closed or server-banned-owner markets via /markets view <player>
    default: op
  markets.command.reviews:
    description: Allows access to the /markets reviews command
    default: true
  markets.command.topstores:
    description: Allows access to the /markets topstores command
    default: true
  markets.command.topstores.export:
    description: Allows exporting top stores data to a file
    default: op
  markets.command.shipping:
    description: Allows access to the /markets shipping command
    default: true
  markets.admin.shipping:
    description: Allows configuring shipping settings via /markets admin shipping
    default: op
  markets.admin.worth:
    description: Allows configuring Essentials worth price limit settings via /markets admin worth
    default: op
  markets.admin.audit:
    description: Allows auditing market listings against Essentials worth via /markets admin audit
    default: op
  markets.bypass.worthpricelimit:
    description: Allows bypassing the Essentials worth-based and absolute Vault price caps when listing items
    default: op
  markets.shipping.exempt.flat:
    description: Exempts the player from flat/base shipping charges
    default: false
  markets.shipping.exempt.distance:
    description: Exempts the player from distance-based shipping charges
    default: false
  markets.alerts.dupe:
    description: Receive alerts when dupe exploits are detected or prevented
    default: op
  markets.bypass.maxstockperlisting:
    description: Allows bypassing the max stock-per-listing cap
    default: op